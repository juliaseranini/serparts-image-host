<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SERPARTS • Hospedagem de Imagens</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;max-width:820px;margin:48px auto;padding:0 20px;color:#111}h1{font-size:30px;margin-bottom:8px}p{line-height:1.5;color:#444}.box{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:24px}input{width:100%;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:14px}button{margin-top:12px;padding:12px 18px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}code{display:block;margin-top:16px;padding:14px;background:#f5f5f5;border-radius:8px;word-break:break-all;min-height:44px}small{color:#666}
</style>
</head>
<body>
<h1>SERPARTS • Hospedagem de Imagens</h1>
<p>Gera um endereço público no domínio da SERPARTS a partir de uma URL direta de imagem.</p>
<div class="box">
  <label for="src"><strong>URL direta da imagem</strong></label>
  <input id="src" type="url" placeholder="https://.../foto.jpg" />
  <button onclick="gerar()">Gerar link hospedado</button>
  <code id="out">Seu link aparecerá aqui.</code>
  <small>O link gerado retorna a própria imagem e pode ser usado em integrações que aceitem URL pública de imagem.</small>
</div>
<script>
function gerar(){
 const src=document.getElementById('src').value.trim();
 if(!src) return;
 document.getElementById('out').textContent = location.origin + '/api/image?url=' + encodeURIComponent(src);
}
</script>
</body>
</html>
